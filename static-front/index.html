<!doctype html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpendWise</title>
<meta name="description" content="See where your money went." />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#06140f" />
<style>
  /* ── SpendWise cold-start front (plan C — deploy to an ALWAYS-ON static host
       such as Cloudflare Pages / Netlify / GitHub Pages; NOT to Render, which
       would burn the shared free instance-hours). It shows instantly while the
       Render backend wakes, then hands off. Self-contained: no build, no deps. */
  :root { --gold: #e8c86a; --gold-2: #d9ab34; --ink: #f3efe2; --muted: #a9c6b5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: 1fr auto; overflow: hidden; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(201,162,39,.28), transparent 60%),
      radial-gradient(90% 70% at 50% -10%, #0c2a1e, transparent 70%),
      linear-gradient(180deg, #06140f 0%, #04100b 55%, #020a07 100%);
    -webkit-user-select: none; user-select: none;
  }
  .stage { position: relative; display: grid; place-items: center; min-height: 0; }
  .hero { text-align: center; display: grid; gap: 12px; padding: 24px; z-index: 2; }
  .mark {
    font-weight: 700; letter-spacing: -.02em; font-size: clamp(2.4rem, 9vw, 4.6rem); line-height: 1;
    background: linear-gradient(180deg, #fbf4dd, var(--gold) 60%, var(--gold-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 30px rgba(201,162,39,.25));
    opacity: 0; transform: translateY(14px); animation: rise .8s .9s ease-out forwards;
  }
  .tag { color: var(--muted); font-size: clamp(.95rem, 2.6vw, 1.2rem);
         opacity: 0; animation: rise .8s 1.2s ease-out forwards; }
  .coin {
    position: absolute; left: 50%; width: clamp(74px,18vw,116px); height: clamp(74px,18vw,116px);
    margin-left: calc(clamp(74px,18vw,116px) / -2); border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: clamp(32px,8vw,52px);
    color: #5a4410;
    background: radial-gradient(circle at 34% 30%, #fff3c4, #f2d175 38%, #d9ab34 68%, #a9811f 100%);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.6), inset 0 -3px 6px rgba(120,85,10,.5), 0 10px 22px rgba(0,0,0,.45);
    transform: translateY(-60vh) rotate(-40deg); animation: drop 1s .1s cubic-bezier(.2,1.1,.3,1) forwards;
  }
  .ripple { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
            border-radius: 50%; border: 1.5px solid rgba(233,200,106,.5); transform: scale(0); opacity: .5; }
  .r1 { animation: ring 1.1s .75s ease-out forwards; }
  .r2 { animation: ring 1.1s .9s ease-out forwards; }
  .r3 { animation: ring 1.1s 1.05s ease-out forwards; }
  .foot { display: grid; gap: 10px; padding: 16px clamp(16px,6vw,56px) calc(18px + env(safe-area-inset-bottom,0)); z-index: 2; }
  .hint { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; color: var(--muted); }
  .rail { position: relative; height: 5px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .rail > span { position: absolute; inset: 0 auto 0 0; width: 4%; border-radius: 999px;
                 background: linear-gradient(90deg, #3f7d5c, var(--gold)); transition: width .6s cubic-bezier(.2,0,0,1); }
  .enter { justify-self: end; appearance: none; border: 1px solid rgba(120,85,10,.4); font: inherit; font-weight: 600;
           font-size: .9rem; padding: 10px 18px; border-radius: 999px; color: #3a2c08; cursor: pointer;
           background: linear-gradient(180deg, #f2d175, var(--gold-2)); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .enter.on { opacity: 1; pointer-events: auto; }
  @keyframes drop { to { transform: translateY(0) rotate(0); } }
  @keyframes ring { to { transform: scale(7); opacity: 0; } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .coin, .ripple { display: none; } .mark, .tag { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="coin" aria-hidden="true">₹</div>
    <div class="ripple r1" aria-hidden="true"></div>
    <div class="ripple r2" aria-hidden="true"></div>
    <div class="ripple r3" aria-hidden="true"></div>
    <div class="hero">
      <div class="mark">SpendWise</div>
      <div class="tag">Where did it all go?</div>
    </div>
  </div>
  <div class="foot">
    <div class="hint">
      <span id="status">Warming up the vault…</span>
      <span id="elapsed">0s</span>
    </div>
    <div class="rail" aria-hidden="true"><span id="bar"></span></div>
    <button class="enter" id="enter" type="button">Enter SpendWise →</button>
  </div>

<script>
  // CONFIG — set these before deploying. APP_URL is where the real app lives;
  // BACKEND_URL is the same origin whose /healthz we ping to wake it.
  var APP_URL = "https://spendwise-bvp4.onrender.com/";
  var BACKEND_URL = "https://spendwise-bvp4.onrender.com";
  var EST_WAKE_S = 75; // typical Render cold start, for the progress estimate only

  var bar = document.getElementById("bar");
  var elapsed = document.getElementById("elapsed");
  var statusEl = document.getElementById("status");
  var enter = document.getElementById("enter");
  var start = Date.now();
  var done = false;

  function goToApp() { if (!done) return; window.location.replace(APP_URL); }
  enter.addEventListener("click", function () { window.location.replace(APP_URL); });

  // Honest progress: elapsed vs. estimate, capped at 95% until the server is up.
  var tick = setInterval(function () {
    var s = Math.floor((Date.now() - start) / 1000);
    elapsed.textContent = s + "s";
    if (!done) {
      var pct = Math.min(95, Math.round((s / EST_WAKE_S) * 100));
      bar.style.width = pct + "%";
    }
  }, 250);

  function ready() {
    if (done) return;
    done = true;
    clearInterval(tick);
    bar.style.width = "100%";
    statusEl.textContent = "Ready";
    enter.classList.add("on");
    setTimeout(function () { window.location.replace(APP_URL); }, 900);
  }

  // Wake the backend and detect readiness. Render HOLDS the request during a
  // cold start and answers once the container is up, so a resolved fetch == awake.
  // no-cors because the backend runs without CORS (SW-ADR-020); we only need the
  // request to land and resolve, not to read the body. Retry on transient error.
  function wake() {
    fetch(BACKEND_URL + "/healthz", { mode: "no-cors", cache: "no-store" })
      .then(function () { ready(); })
      .catch(function () { if (!done) setTimeout(wake, 5000); });
  }
  wake();
</script>
</body>
</html>
