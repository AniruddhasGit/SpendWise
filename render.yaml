# Render blueprint for the always-on SpendWise showcase.
# Deploys the SAME container as AWS (one image serves the FastAPI API and the
# built React client), but on Render with free HTTPS. The AWS version — the
# full ECS/RDS/OIDC pipeline — lives in the SpendWise_AWS repo.
#
# Render tracks the `main` branch: a push to main redeploys automatically.
#
# The database is NOT provisioned here. The app's security model needs two roles
# (an owner that runs migrations and owns the tables, and a runtime role that is
# not superuser and holds no BYPASSRLS — the isolation guarantee is asserted at
# boot). Point these at a free persistent Postgres (Neon recommended; see
# README "Deploying the showcase"). `?ssl=require` is mandatory for asyncpg.
services:
  - type: web
    name: spendwise
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL            # runtime (app) role
        sync: false
      - key: MIGRATION_DATABASE_URL  # owner role; runs alembic at boot
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@spendwise.app
      - key: COOKIE_SECURE           # Render serves HTTPS, so this is true here
        value: "true"
      - key: UVICORN_WORKERS         # free tier is small; one worker, one limiter
        value: "1"

  # The always-on front (SW-ADR-160). Render's free static sites never sleep,
  # so the landing page's tree and fog appear at once while the web service
  # above wakes up behind a countdown. /api/* and /healthz are rewritten to the
  # web service, so the browser stays same-origin (no CORS, SW-ADR-020), and
  # the API's security headers are repeated here for the pages it serves.
  - type: web
    runtime: static
    name: spendwise-front
    branch: main
    autoDeploy: false
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://spendwise-bvp4.onrender.com/api/*
      - type: rewrite
        source: /healthz
        destination: https://spendwise-bvp4.onrender.com/healthz
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
